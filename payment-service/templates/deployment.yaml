names:
 service: pr-device
 deployment: pr-device
 namespace: dev
 role: pr-device-reader
 rolebinding: pr-device-reader-binding
 serviceAccount: default


bind:
 rules:
 - apiGroups: [""]
   resources: ["services"]
   resourceNames: ["pr-device"]
   verbs: ["get", "watch", "list"]


 roleRef:
   kind: Role
   name: pr-device-reader
   apiGroup: rbac.authorization.k8s.io


 application:
 replicas: 2
 environment: dev
 app: pr-device
 container:
   name: pr-device
   image: 59237748339.dkr.ecr.us-east-2.amazonaws.com/pr_device-dev:113
   imagePullPolicy: Always
   containerPort: 8082
   protocol: TCP
   imagePullSecrets: regcred
   resources:
     limits:
       cpu: 256m
       memory: 512Mi
     requests:
       cpu: 256m
       memory: 512Mi
 livenessProbe:
   httpGet:
     path: /actuator/health/liveness
     port: 8082
   initialDelaySeconds: 400
   periodSeconds: 30
   failureThreshold: 4
   timeoutSeconds: 10
 readinessProbe:
   httpGet:
     path: /actuator/health/readiness
     port: 8082
   initialDelaySeconds: 400
   periodSeconds: 30
   failureThreshold: 4
   timeoutSeconds: 10
 env:
   - name: CLUSTER_NAME
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: CLUSTER_NAME
   - name: MYSQL_HOST
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: MYSQL_HOST
   - name: MYSQL_PORT
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: MYSQL_PORT
   - name: MYSQL_USER
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: MYSQL_USER
   - name: MYSQL_PASSWORD
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: MYSQL_PASSWORD
   - name: DB_NAME
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: DB_NAME
   - name: AWS_ACCESS_KEY
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: AWS_ACCESS_KEY
   - name: AWS_SECRET_KEY
     valueFrom:
       secretKeyRef:
         name: dev-params
         key: AWS_SECRET_KEY


service:
 type: ClusterIP
 port: 8082
 targetPort: 8082


secretmanager:
 name: dev-secret


parameterstore:
 name: dev-params
